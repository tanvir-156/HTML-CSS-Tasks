<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.container {
  display: grid;
  gap:30px;
  grid-template-columns: auto auto auto;
  background-color: dodgerblue;
  padding: 10px;
  
}
.container div {
  background-color: #f1f1f1;
  border: 1px solid black;
  padding: 10px;
  font-size: 30px;
  text-align: center;

}

@media(max-width: 768px){
    .container{
        grid-template-columns: auto auto;
        color: green;
        background-color: bisque;
    }
}
@media(max-width: 425px){
    .container{
        grid-template-columns: auto;
        background-color: aqua;
        color: black;
    }
}

</style>
<body>
    <div class="container">
  <div>
    <h3>1</h3>
    <p>Table</p>    
</div>
  <div><h3>2</h3>
    <p>Table</p> </div>
  <div><h3>3</h3>
    <p>Table</p> </div>
  <div><h3>4</h3>
    <p>Table</p> </div>
  <div><h3>5</h3>
    <p>Table</p> </div>
  <div><h3>6</h3>
    <p>Table</p> </div>
</div>
</body>
</html>
