<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: roboto;
        }
        body{
            height:1000px;

        }

        #box{
            max-width: 100%;
            height: auto;
            margin:10px;
            border: 5px dashed;


        }
        
        #square{
            background-color: black;
            width: 200px;
            height: 200px;
            margin:10px;
            position: fixed;
            top:50px;
            right: 5px;

        }

    </style>
</head>
<body>
    <div id="box"></div>
    <div id="square"></div>
</body>
</html>
