<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Notification</title>

    <style>
        .toast{
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: black;
            padding: 10px;
            border-radius: 13px;
            /* box-shadow: 5px 5px; */
            width: 360px;
            

        }

        .icon{

            border-radius: 50%;
            width: 40px;
            height: 40px;
            background-color: rgb(42, 165, 44);
     

        }

        .message p{
            color: white;
            margin:0;
            padding:0;
        }

        .button {
            background-color: black;
            color: white;
            stroke-opacity: 0%;
            border: none;
            font-size: 25px;
            margin-left: 120px;
        }

        @media(max-width:425px){
            .toast{
                max-width:100%;
            }
        }

    </style>
</head>

<body>
    <div class="toast">

        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentcolor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
        </div>

        <div class="message">
            <p>New location created</p>
            <p>successfully</p>
        </div>

        <button class="button">X</button>

    </div>

</body>

</html>
