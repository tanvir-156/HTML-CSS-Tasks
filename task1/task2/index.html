<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>

        .container{
            display: flex;
            background-color: aqua;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: center;
            height: auto;
            align-items: center;

        }

        .container div{
            font-size: 35px;
            margin: 10px;
            padding: 20px;
            max-width: 100%;
            background-color: rgb(223, 28, 100);
            text-align: center;
        }

    </style>
</head>
<h2>Structure:</h2>
<body>
    <div class="container">
        <div>-</div>
        <div>-</div>
        <div>-</div>
        <div>-</div>
        <div>-</div>
        <div>-</div>

    </div>
</body>
</html>
