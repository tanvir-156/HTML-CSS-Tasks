<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Elements</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
    
        }
        body{
            display: flex;
            height: 100vh;
            width: 100vw;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(45deg,#11998e,#38ef7d)
            
        }
        #square{
            background-color: black;
            width: 200px;
            height: 200px;
            margin:10px;
            position: sticky;
            top: 100px;

        }
        #circle{
            background-color: red;
            width: 50px;
            height:50px;
            color:white;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 100%;
            top: -15px;
            right: -15px;
            position: absolute;


        }
        
    </style>

</head>
<body>
    <div id="square">
    <div id="circle">99+</div>
        
    </div>
</body>
</html>
